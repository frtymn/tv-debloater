<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { width: 1600px; height: 1000px; overflow: hidden;
    background: radial-gradient(900px 600px at 50% 105%, rgba(138,180,248,.30), transparent 70%),
                radial-gradient(700px 500px at 0% 0%, rgba(90,70,200,.28), transparent 70%),
                linear-gradient(160deg, #0B1020 0%, #121A35 55%, #0B1020 100%); }
  header { position: absolute; top: 64px; left: 0; right: 0; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 18px; }

  h1 { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
  p.tag { margin-top: 14px; font-size: 28px; font-weight: 500; color: #B9C4DA; }
  .row { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; align-items: flex-start; gap: 56px; }
  .row .phone { width: 330px; height: 718px; }
  .row .mid { transform: translateY(-24px); }
</style></head>
<body>
  <header>
    <div class="brand"><img src="icon.svg" alt=""><h1>TV Debloater</h1></div>
    <p class="tag">Disable preinstalled Android TV apps from your phone. No root, no computer.</p>
  </header>
  <div class="row">
    <div class="phone"><div class="screen"><img src="../screenshots/03-packages.png"></div></div>
    <div class="phone mid"><div class="screen"><img src="../screenshots/04-confirm-dry-run.png"></div></div>
    <div class="phone"><div class="screen"><img src="../screenshots/05-results.png"></div></div>
  </div>
</body></html>
