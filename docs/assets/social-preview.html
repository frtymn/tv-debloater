<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  /* 1280x640, everything important stays inside an 80 px safe margin. */
  body { width: 1280px; height: 640px; overflow: hidden; position: relative;
    background: radial-gradient(620px 520px at 88% 30%, rgba(138,180,248,.32), transparent 70%),
                radial-gradient(700px 500px at 0% 100%, rgba(98,72,214,.38), transparent 70%),
                linear-gradient(135deg, #0A0F24 0%, #141C44 55%, #1C1650 100%); }
  .logo { position: absolute; top: 80px; left: 80px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; }
  .logo img { width: 44px; height: 44px; }
  .copy { position: absolute; left: 80px; top: 80px; bottom: 80px; width: 720px; display: flex; flex-direction: column; justify-content: center; padding-top: 40px; }
  h1 { font-size: 70px; line-height: 1.06; font-weight: 800; letter-spacing: -2px; }
  p { margin-top: 28px; font-size: 32px; font-weight: 500; color: #B9C4DA; }
  .phone { position: absolute; right: 110px; top: 80px; width: 222px; height: 480px; border-radius: 34px; padding: 9px; }
  .phone .screen { border-radius: 26px; }
</style></head>
<body>
  <div class="logo"><img src="icon.svg" alt="">TV Debloater</div>
  <div class="copy">
    <h1 id="h">Debloat your Android TV from your phone</h1>
    <p id="sub">No root. No computer. Reversible.</p>
  </div>
  <div class="phone"><div class="screen"><img id="shot" src="../screenshots/03-packages.png"></div></div>
  <script>
    // social-preview.html = English, social-preview.html?lang=tr = Turkish text and screenshot.
    if (new URLSearchParams(location.search).get("lang") === "tr") {
      document.documentElement.lang = "tr";
      document.getElementById("h").textContent = "Android TV'nizi telefonunuzdan sadeleştirin";
      document.getElementById("sub").textContent = "Root yok. Bilgisayar yok. Geri alınabilir.";
      document.getElementById("shot").src = "../screenshots/03-packages-tr.png";
    }
  </script>
</body></html>
