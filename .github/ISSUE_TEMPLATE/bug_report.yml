name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please remove IP addresses or other personal data from logs before posting.
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Settings > About in the app.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: tv_model
    attributes:
      label: TV model
      placeholder: "Xiaomi Mi TV Stick (MDZ-24-AA)"
    validations:
      required: true
  - type: input
    id: tv_android
    attributes:
      label: TV Android version and firmware
      placeholder: "Android TV 9, firmware ..."
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 7, Android 14"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output or logs
      description: Copy the raw output from the Results or History screen.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tried the latest release.
        - label: I removed personal data from the logs.
