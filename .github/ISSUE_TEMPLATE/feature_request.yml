name: Feature request
description: Suggest an idea for TV Debloater.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: markdown
    attributes:
      value: The app only changes the package state of the connected device. Requests for root, flashing or data deletion will be closed.
