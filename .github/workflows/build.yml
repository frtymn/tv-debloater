name: Build debug APK

on:
  push:
    # The "db" branch only holds the published package database (see db.yml), no app code.
    branches: ["**", "!db"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast consistency checks (tools/repo_checks.py): README images and links, string keys in both
  # languages, permissions explained in the READMEs, the package database, and on tags the version and notes.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the JSON Schema validator
        run: python -m pip install --quiet "jsonschema==4.26.0"

      - name: Repository checks
        run: |
          python tools/test_db_build.py
          python tools/repo_checks.py

  build:
    needs: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (also validates the wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v .
          rm gitleaks

      # A fixed debug key (repository secret) so a newer APK installs over an older one.
      # Without the secret (for example in forks), Gradle makes a new debug key as usual.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using the repository debug key"
          else
            echo "No DEBUG_KEYSTORE_B64 secret: using a temporary debug key"
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Check the bundled package database (no drift from db/packages.json)
        run: python3 tools/db_build.py check --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Check the APK version
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1 | tee badging.txt
          if [ -n "${VERSION_NAME:-}" ] && ! grep -q "versionName='${VERSION_NAME}'" badging.txt; then
            echo "::error::The APK versionName does not match the tag ${GITHUB_REF_NAME}"; exit 1
          fi
          rm badging.txt

      # The SHA-256 of the repository debug key's certificate (public, not a secret).
      # Releases must be signed with it, otherwise updates would not install over older versions.
      - name: Check the signing key
        env:
          EXPECTED_CERT_SHA256: 8d2271aa7582310236c2d4a522ba01de868df9b5aac08a4f0de4120018c0db82
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ -n "${DEBUG_KEYSTORE_FILE:-}" ]; then
            [ "$ACTUAL" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::The APK is not signed with the repository debug key"; exit 1; }
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release builds need the DEBUG_KEYSTORE_B64 secret"; exit 1
          else
            echo "No repository key (fork or pull request): temporary debug key, not checked"
          fi
          rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/tv-debloater-debug.apk
          (cd out && sha256sum tv-debloater-debug.apk | tee tv-debloater-debug.apk.sha256)

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tv-debloater-debug-apk
          path: out/
          if-no-files-found: error

      # Releases are made only from version tags (v0.1.1, ...). Notes come from docs/release-notes/<tag>.md.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TV Debloater ${{ github.ref_name }} (beta)
          body_path: docs/release-notes/${{ github.ref_name }}.md
          make_latest: "true"
          files: |
            out/tv-debloater-debug.apk
            out/tv-debloater-debug.apk.sha256
