name: Docs images

# Renders the README screenshots (Roborazzi on the JVM, demo data), the hero collage and the
# social preview image (HTML templates in docs/assets rendered by headless Chromium).
# Run it from the Actions tab: "Docs images" > "Run workflow".

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the rendered images back to this branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: docs-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Render app screenshots (Robolectric + Roborazzi, 1080x2400)
        env:
          SCREENSHOTS: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --tests '*ScreenshotTest*'

      - name: Install PNG optimizers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngquant oxipng || sudo apt-get install -y -qq pngquant optipng

      - name: Optimize screenshots into docs/screenshots
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/*.png docs/screenshots/
          python3 tools/optimize_png.py docs/screenshots/*.png

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Render hero collage and social preview (Playwright, headless Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node docs/assets/render.mjs
          python3 tools/optimize_png.py docs/hero.png docs/social-preview.png
          python3 tools/check_images.py

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: docs-images
          path: |
            docs/screenshots/*.png
            docs/hero.png
            docs/social-preview.png

      - name: Commit images
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/hero.png docs/social-preview.png
          if git diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git commit -m "Docs: re-render screenshots, hero and social preview"
          git push
